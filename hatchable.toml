[auth]
enabled = true
providers = ["email"]

[ai]
required = true
providers = ["openai"]

[db.tables.bills]
read = "own"
write = "own"

[db.tables.bill_categories]
read = "own"
write = "own"

[db.tables.bill_category_settings]
read = "own"
write = "own"

[db.tables.bill_payment_methods]
read = "own"
write = "own"

[db.tables.bill_sessions]
read = "own"
write = "own"

[[secret]]
name = "ONESIGNAL_APP_ID"
expose = false

[[secret]]
name = "ONESIGNAL_API_KEY"
expose = false